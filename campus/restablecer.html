<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña | EMC Academy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="../assets/img/isotipo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="restablecer" data-root="../">
<main id="main" class="auth-page">
  <div class="container" style="display: flex; justify-content: center;">
    <div class="auth-card">
      <img src="../assets/img/isotipo.jpeg" alt="" width="72" height="72">
      <h1>Nueva contraseña</h1>
      <p class="sub">Elige una contraseña de al menos 10 caracteres.</p>
      <div class="alert" id="reset-msg" role="alert" tabindex="-1" hidden></div>
      <form class="auth-form" id="reset-form" novalidate>
        <div class="field"><label for="p1">Nueva contraseña</label><input id="p1" name="password" type="password" autocomplete="new-password" minlength="10" required></div>
        <div class="field"><label for="p2">Repite la contraseña</label><input id="p2" name="password2" type="password" autocomplete="new-password" minlength="10" required></div>
        <button type="submit" class="btn btn-primary btn-block">Guardar contraseña</button>
      </form>
      <p class="auth-foot"><a href="login.html" style="color: var(--blue-light);">Volver a iniciar sesión</a></p>
    </div>
  </div>
</main>
<script src="../js/data.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/api.js"></script>
<script src="../js/campus.js"></script>
</body>
</html>
