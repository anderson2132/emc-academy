<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Virtual | EMC Academy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/jpeg" href="../assets/img/isotipo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css?v=20261122j">
</head>
<body data-page="login" data-root="../">
<main id="main" class="auth-page">
  <div class="container" style="display: flex; justify-content: center;">
    <div class="auth-card">
      <img src="../assets/img/isotipo.jpeg" alt="" width="72" height="72">
      <h1>Campus Virtual</h1>
      <p class="sub">Tus clases, grabaciones, tareas y asistencia en un solo lugar.</p>

      <div class="alert alert-info" id="enroll-context" hidden></div>
      <div class="alert" id="auth-msg" role="alert" tabindex="-1" hidden></div>

      <div class="tabs" role="tablist" aria-label="Acceso">
        <button type="button" role="tab" id="tab-login" aria-controls="panel-login" aria-selected="true">Ingresar</button>
        <button type="button" role="tab" id="tab-register" aria-controls="panel-register" aria-selected="false">Crear cuenta</button>
      </div>

      <div class="sso" id="sso">
        <button type="button" class="btn btn-ghost" data-provider="google"><i class="fa-brands fa-google" aria-hidden="true"></i> Continuar con Google</button>
        <button type="button" class="btn btn-ghost" data-provider="microsoft"><i class="fa-brands fa-microsoft" aria-hidden="true"></i> Continuar con Microsoft</button>
      </div>
      <div class="divider">o con tu correo</div>

      <div id="panel-login" role="tabpanel" aria-labelledby="tab-login">
        <form class="auth-form" id="login-form" novalidate>
          <div class="field"><label for="l-email">Correo o usuario</label><input id="l-email" name="login" autocomplete="username" required></div>
          <div class="field"><label for="l-pass">Contraseña</label><input id="l-pass" name="password" type="password" autocomplete="current-password" required></div>
          <div class="auth-links"><a href="#" id="forgot-link">¿Olvidaste tu contraseña?</a></div>
          <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        </form>
      </div>

      <div id="panel-register" role="tabpanel" aria-labelledby="tab-register" hidden>
        <form class="auth-form" id="register-form" novalidate>
          <div class="field"><label for="r-name">Nombres y apellidos</label><input id="r-name" name="fullName" autocomplete="name" required minlength="3"></div>
          <div class="field"><label for="r-email">Correo</label><input id="r-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="r-pass">Contraseña (mínimo 8 caracteres)</label><input id="r-pass" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
          <label class="field-check"><input type="checkbox" required> Acepto los <a href="#">términos</a> y la <a href="#">política de privacidad</a>.</label>
          <button type="submit" class="btn btn-primary btn-block">Crear cuenta</button>
        </form>
      </div>

      <p class="auth-foot">Las cuentas nuevas son revisadas y aprobadas por nuestro equipo antes de acceder a los cursos.</p>
    </div>
  </div>
</main>
<script src="../js/data.js?v=20261122j"></script>
<script src="../js/layout.js?v=20261122j"></script>
<script src="../js/api.js?v=20261122j"></script>
<script src="../js/campus.js?v=20261122j"></script>
</body>
</html>
